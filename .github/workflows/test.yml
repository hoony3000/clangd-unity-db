name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler diagnostics tools
        run: sudo apt-get update && sudo apt-get install -y gcc make clang clangd
      - name: Verify required tools
        run: gcc --version && clang --version && clangd --version
      - name: Run integration tests
        run: python3 -m unittest discover -s tests -v
